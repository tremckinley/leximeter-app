services:
  - type: web
    name: language-finder-api
    plan: free
    env: node
    rootDir: server
    buildCommand: bash ./render-build.sh
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/.cache
      - key: ALLOWED_ORIGIN
        sync: false  # Set manually in the Render dashboard to your frontend URL
